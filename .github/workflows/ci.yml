name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  REPO_DIR: flowi-cli

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: flowi-cli
    steps:
      - uses: actions/checkout@v5
        with:
          path: flowi-cli
      - uses: actions/setup-go@v6
        with:
          go-version-file: flowi-cli/go.mod
      - run: go test -race ./...

  nocgo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowi-cli
    steps:
      - uses: actions/checkout@v5
        with:
          path: flowi-cli
      - uses: actions/setup-go@v6
        with:
          go-version-file: flowi-cli/go.mod
      - name: build without cgo
        run: CGO_ENABLED=0 go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: flowi-cli
      - uses: actions/setup-go@v6
        with:
          go-version-file: flowi-cli/go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14
          working-directory: flowi-cli

  vuln:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowi-cli
    steps:
      - uses: actions/checkout@v5
        with:
          path: flowi-cli
      - uses: actions/setup-go@v6
        with:
          go-version-file: flowi-cli/go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
